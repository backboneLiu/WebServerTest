name: ci

# 三段式流水线：lint → test → build。
# test 和 lint 合并成一个 job 是为了少一次环境准备（uv sync 才是耗时大头），
# 但每一步都用独立的 step，失败时能精确看出是哪一环。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # 同一个分支连续 push 时，取消还在跑的旧任务，省 CI 分钟数
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked：uv.lock 与 pyproject.toml 不一致就直接失败，
      # 避免 CI 悄悄解析出与本地不同的版本（"本地过、CI 挂"的经典来源）。
      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

  build:
    name: docker build + size gate
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pricing-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 验收清单要求镜像 < 200MB，这里做成硬门禁：
      # 超了 CI 直接红，而不是等人上线后才发现。
      - name: Enforce image size < 200MB
        run: |
          SIZE=$(docker image inspect pricing-api:ci --format='{{.Size}}')
          echo "image size: $((SIZE / 1024 / 1024)) MB (limit 200 MB)"
          if [ "$SIZE" -ge 209715200 ]; then
            echo "::error::镜像超过 200MB 上限"
            exit 1
          fi

      # 容器起来了不代表能算价：这里真跑一次端到端冒烟，
      # 用的是 README 第 8 条（Gold，10 × 5000 → 41500.00）。
      - name: Smoke test container
        run: |
          docker run -d --name api \
            -p 8000:8000 \
            -e JWT_SECRET=ci-secret-0123456789abcdef-0123456789 \
            -e DATABASE_URL=sqlite:////tmp/audit.db \
            pricing-api:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 1
          done

          echo "--- health ---"
          curl -fsS http://127.0.0.1:8000/health

          echo "--- quote ---"
          TOKEN=$(docker exec api python -c \
            "import os; from pricing_api.security import create_token; print(create_token('ci', os.environ['JWT_SECRET']))")

          RESP=$(curl -sS -X POST http://127.0.0.1:8000/v1/quote \
            -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            -d '{"orderId":"CI-1","tier":"Gold","lines":[{"sku":"A","quantity":10,"unitPrice":"5000"}]}')
          echo "$RESP"

          echo "$RESP" | grep -q '"total":"41500.00"' || { echo "::error::计价结果不符"; exit 1; }

          docker rm -f api
